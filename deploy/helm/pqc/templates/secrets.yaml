{{- if .Values.ca.enabled }}
{{- /* Passphrases the chart makes when none is given: random, kept across upgrades (lookup) and on uninstall, like the volume. */}}
{{- range $name, $wanted := dict (printf "%s-ca-passphrase" .Release.Name) (not .Values.ca.passphraseSecret) (printf "%s-ca-root-passphrase" .Release.Name) (not .Values.ca.issuingSecret) }}
{{- if $wanted }}
{{- $old := lookup "v1" "Secret" $.Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "pqc.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  passphrase: {{ if $old }}{{ index $old.data "passphrase" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
---
{{- end }}
{{- end }}
{{- end }}
