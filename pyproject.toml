[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc"
version = "0.1.0"
description = "Post-quantum TLS 1.3 and mTLS, with your own certificate authority"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=49"]
authors = [{name = "Acxelin Quantum"}]

[project.urls]
Source = "https://github.com/QubitMan-hub/PQC"
Changelog = "https://github.com/QubitMan-hub/PQC/blob/main/CHANGELOG.md"

[project.optional-dependencies]
kms = ["boto3>=1.35"]
test = ["coverage>=7.6", "hypothesis>=6.100", "pytest>=9"]
integration = ["acme>=4", "certbot>=4; sys_platform != 'win32'"]  # the ACME tests against certbot's client

[project.scripts]
pqc = "pqc.cli:main"

[tool.setuptools.packages.find]
include = ["pqc*"]

[tool.setuptools.package-data]
"pqc.console" = ["console.html"]

[tool.distutils.build]
build_base = "dist/.build"  # keeps `pip wheel .` from leaving build/ in the source tree

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "node_modules"]

[tool.coverage.run]
source = ["pqc"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
ignore = ["E401", "E702", "E731", "E741"]
