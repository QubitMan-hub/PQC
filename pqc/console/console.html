<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQC console</title>
<style>
:root { --bg: #f6f5f1; --paper: #fff; --ink: #2e3c4e; --body: #3f4c59; --muted: #6a7480; --rule: #e4dfd3; --soft: #f1eee6;
  --amber: #ffbf00; --amber-deep: #8a6100; --amber-wash: #fff6dc; --ok: #1f7a4d; --ok-wash: #e6f4ec; --bad: #b3261e; --bad-wash: #fbe9e7;
  --warn: #8a6100; --side: #2e3c4e; --side-ink: #d9dee5; --code: #1f2a37; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #151b23; --paper: #1d2530; --ink: #eef1f5; --body: #c9d0d8; --muted: #8e99a6; --rule: #2e3846;
  --soft: #232c38; --amber-deep: #ffcf4d; --amber-wash: #3a3016; --ok: #5cc98f; --ok-wash: #173326; --bad: #ff8a80; --bad-wash: #3d1c1a;
  --warn: #ffcf4d; --side: #10151c; --code: #0f141a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.55 "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; }
h1, h2, h3 { color: var(--ink); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
button, input, select { font: inherit; color: inherit; }
code, pre, .mono { font-family: "Cascadia Mono", "Roboto Mono", ui-monospace, Consolas, monospace; font-size: 13px; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
aside { background: var(--side); color: var(--side-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { color: #fff; font-size: 16px; letter-spacing: .02em; }
.brand small { display: block; color: #9aa6b4; font-size: 12px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--amber); display: grid; place-items: center; color: #2e3c4e; font-weight: 800; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; color: var(--side-ink); }
nav button:hover { background: rgba(255,255,255,.06); }
nav button[aria-current="page"] { background: rgba(255,191,0,.14); color: #fff; box-shadow: inset 3px 0 0 var(--amber); }
nav button:focus-visible { outline: 2px solid var(--amber); }
nav svg { width: 18px; height: 18px; flex: none; }
.side-foot { margin-top: auto; font-size: 12px; color: #9aa6b4; padding: 0 8px; display: grid; gap: 6px; }
.side-foot button { all: unset; cursor: pointer; color: #c9d0d8; text-decoration: underline; }
main { padding: 26px 32px 60px; max-width: 1180px; width: 100%; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 20px; }
.top p { margin: 4px 0 0; color: var(--muted); }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--amber-deep); margin: 0 0 4px; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.two { grid-template-columns: 1.2fr 1fr; align-items: start; }
.tile h3 { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.big { font-size: 30px; font-weight: 650; color: var(--ink); line-height: 1.15; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.ok { color: var(--ok); background: var(--ok-wash); } .bad { color: var(--bad); background: var(--bad-wash); }
.warn { color: var(--warn); background: var(--amber-wash); } .neutral { color: var(--muted); background: var(--soft); }
.btn { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--amber); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #2e3c4e; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
form.issue { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
label span { font-weight: 400; color: var(--muted); }
input, select { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 7px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.life { width: 90px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 4px; }
.life i { display: block; height: 100%; background: var(--ok); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--rule); font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.feed li { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; align-items: center; }
.feed li:last-child { border-bottom: 0; }
.feed time { color: var(--muted); font-size: 12px; }
.bar { height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 8px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.edge { display: grid; gap: 12px; }
.edge header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.route { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.route .mono { color: var(--ink); background: var(--soft); padding: 2px 8px; border-radius: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.flow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin: 6px 0 18px; }
.node { text-align: center; font-size: 13px; color: var(--muted); }
.node b { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 14px; margin: 0 auto 6px; background: var(--soft); color: var(--ink); }
.node svg { width: 26px; height: 26px; }
.wire { position: relative; height: 4px; border-radius: 2px; background: var(--rule); }
.wire.go { background: linear-gradient(90deg, var(--ok), var(--amber)); }
.wire.no { background: repeating-linear-gradient(90deg, var(--bad) 0 10px, transparent 10px 16px); }
.wire em { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); font-style: normal; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; background: var(--paper); padding: 0 8px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.checks i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; }
.checks .y i { background: var(--ok-wash); color: var(--ok); } .checks .n i { background: var(--bad-wash); color: var(--bad); }
.checks .m i { background: var(--soft); color: var(--muted); }
.checks small { display: block; color: var(--muted); }
.verdict { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-weight: 600; }
.verdict.ok { border: 1px solid currentColor; } .verdict.bad { border: 1px solid currentColor; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 12px; overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 14px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--amber); font-weight: 600; }
.snippet { position: relative; }
.snippet pre { background: var(--code); color: #e8edf3; padding: 14px 16px; border-radius: 10px; overflow-x: auto; margin: 0; line-height: 1.6; }
.snippet .btn { position: absolute; right: 8px; top: 8px; background: #2e3c4e; color: #fff; border-color: #44546a; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 30; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font-size: 14px; }
.toast.err { background: var(--bad); color: #fff; }
dialog { border: 1px solid var(--rule); border-radius: 14px; padding: 0; background: var(--paper); color: var(--body); width: min(460px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(20, 28, 38, .5); }
dialog form { padding: 20px; display: grid; gap: 14px; }
dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 0; padding: 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; color: var(--body); }
.check input { width: auto; margin-top: 4px; }
.login { max-width: 440px; margin: 12vh auto; }
.login form { display: grid; gap: 12px; margin-top: 14px; }
.live { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .7s linear infinite; vertical-align: -2px; }
@keyframes r { to { transform: rotate(360deg); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; padding: 12px 16px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  nav { flex-direction: row; overflow-x: auto; width: 100%; } nav button { white-space: nowrap; padding: 7px 10px; }
  nav button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--amber); }
  .side-foot { display: none; } main { padding: 18px 16px 50px; } .two { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); }
  .feed li { grid-template-columns: 60px 1fr; } .feed li .pill { display: none; }
  .wire em { top: 10px; white-space: normal; width: 100%; text-align: center; background: none; padding: 0; font-size: 11px; }
}
</style>
</head>
<body>
<div id="login" class="login card" hidden>
  <p class="kicker">PQC console</p>
  <h1>Enter the access token</h1>
  <p class="sub">The console printed it when it started, along with a link that signs you in directly. The token stays in this tab only.</p>
  <form id="loginForm"><label>Access token<input id="tokenIn" type="password" autocomplete="off" required></label>
  <button class="btn primary">Open the console</button><p id="loginErr" class="sub" role="alert"></p></form>
</div>
<div id="app" class="app" hidden>
<aside>
  <div class="brand"><div class="mark">Q</div><div><b>PQC console</b><small id="ver">TLS 1.3 + mTLS</small></div></div>
  <nav aria-label="Pages">
    <button data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</button>
    <button data-page="certificates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><circle cx="16" cy="17" r="3"/><path d="M15 20l-1 3 2-1 2 1-1-3M7 9h7M7 12h4"/></svg>Certificates</button>
    <button data-page="edges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>Edges</button>
    <button data-page="test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/><circle cx="4" cy="12" r="1.5"/></svg>Test a connection</button>
    <button data-page="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>Client setup</button>
  </nav>
  <div class="side-foot"><span id="caName"></span><span>Local only &middot; every action is audited</span><button id="signOut">Sign out</button></div>
</aside>
<main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script>
"use strict";
const $ = s => document.querySelector(s);
const state = { page: "overview", certs: null, overview: null, edges: null, filter: "all", query: "", kind: "server", setup: { serial: "", tab: "pqc", host: "localhost:8443" }, timer: 0, test: null };
let token = "";
try { token = sessionStorage.getItem("pqc-token") || ""; } catch (e) {}
if (location.hash.startsWith("#token=")) {
  token = decodeURIComponent(location.hash.slice(7));
  try { sessionStorage.setItem("pqc-token", token); } catch (e) {}
  history.replaceState(null, "", location.pathname);
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
function svg(markup) { const t = document.createElement("template"); t.innerHTML = markup; return t.content.firstChild; }
const ICON = {
  you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  srv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01"/></svg>'
};

async function api(path, body) {
  const res = await fetch(path, { method: body ? "POST" : "GET", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if (res.status === 401 || res.status === 429) { signIn(res.status === 429 ? "Too many wrong tokens; wait a minute." : "That token was not accepted."); throw new Error("signed out"); }
  if ((res.headers.get("Content-Type") || "").includes("zip")) return res.blob();
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg, err) {
  const t = h("div", { class: "toast" + (err ? " err" : ""), role: err ? "alert" : "status" }, msg);
  $("#toasts").append(t); setTimeout(() => t.remove(), err ? 7000 : 3500);
}
async function act(btn, fn) {
  const old = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.replaceChildren(h("span", { class: "spin" }), " Working"); }
  try { return await fn(); } catch (e) { if (e.message !== "signed out") toast(e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}
function signIn(msg) {
  try { sessionStorage.removeItem("pqc-token"); } catch (e) {}
  token = ""; clearInterval(state.timer);
  $("#app").hidden = true; $("#login").hidden = false; $("#loginErr").textContent = msg || ""; $("#tokenIn").focus();
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); token = $("#tokenIn").value.trim();
  try { await api("/api/overview"); try { sessionStorage.setItem("pqc-token", token); } catch (x) {} start(); } catch (x) { if (x.message !== "signed out") $("#loginErr").textContent = x.message; }
});
$("#signOut").addEventListener("click", () => signIn("Signed out."));
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));

function go(page) {
  state.page = page;
  document.querySelectorAll("nav button").forEach(b => b.dataset.page === page ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  load();
}
async function load(quiet) {
  try {
    if (state.page === "overview") state.overview = await api("/api/overview");
    if (["certificates", "test", "setup"].includes(state.page)) state.certs = await api("/api/certificates");
    if (state.page === "edges") state.edges = await api("/api/edges");
  } catch (e) { if (e.message === "signed out") return; if (!quiet) toast(e.message, true); state.error = e.message; }
  if (quiet && document.activeElement && document.activeElement.closest("main form, main input, main select")) return;
  render();
}
function start() {
  $("#login").hidden = true; $("#app").hidden = false;
  clearInterval(state.timer);
  state.timer = setInterval(() => { if (!document.hidden && ["overview", "edges"].includes(state.page)) load(true); }, 5000);
  go(state.page);
}

const ago = iso => { const s = (Date.now() - Date.parse(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const head = (kicker, title, sub, ...right) => h("div", { class: "top" }, h("div", {}, h("p", { class: "kicker" }, kicker), h("h1", {}, title), sub && h("p", {}, sub)), h("div", { class: "chips" }, right));
const status = c => c.renewed && c.status !== "revoked" ? h("span", { class: "pill neutral" }, "renewed") : c.status === "revoked" ? h("span", { class: "pill bad" }, "revoked") : c.days_left < 0 ? h("span", { class: "pill bad" }, "expired") : c.days_left <= 30 ? h("span", { class: "pill warn" }, "expires in " + c.days_left + " d") : h("span", { class: "pill ok" }, "valid");

function render() {
  const main = $("#main");
  const view = { overview: viewOverview, certificates: viewCerts, edges: viewEdges, test: viewTest, setup: viewSetup }[state.page]();
  main.replaceChildren(view);
}

function viewOverview() {
  const o = state.overview;
  if (!o) return h("p", { class: "sub" }, "Loading");
  $("#ver").textContent = "version " + o.version;
  const c = o.certificates, e = o.edges, ca = o.ca;
  if (ca) $("#caName").textContent = ca.subject.replace(/^CN=/, "");
  const crl = ca && ca.crl;
  const crlPill = !crl ? h("span", { class: "pill bad" }, "missing") : crl.hours_left < 0 ? h("span", { class: "pill bad" }, "expired") : crl.hours_left < 48 ? h("span", { class: "pill warn" }, "renew soon") : h("span", { class: "pill ok" }, "fresh");
  const edgePill = !(e.routes + e.unreachable) ? h("span", { class: "pill neutral" }, "none added") : e.unreachable ? h("span", { class: "pill bad" }, e.unreachable + " down") : h("span", { class: "pill ok" }, "all up");
  const tiles = h("div", { class: "grid tiles" },
    h("div", { class: "card tile" }, h("h3", {}, "Certificate authority", ca ? h("span", { class: "pill " + (ca.days_left > 90 ? "ok" : "warn") }, ca.days_left > 90 ? "healthy" : "expiring") : h("span", { class: "pill bad" }, "not set")),

    other: "For anything whose TLS library cannot do ML-KEM and ML-DSA yet, including Java's built-in TLS today. Nothing in the app changes.",
  };
  return h("div", {}, head("Client setup", "Connect an app with its certificate", "Download the certificate's zip (cert.pem, chain.pem, key.pem, ca.crt), unpack it next to the app, then use one of these."),
    h("div", { class: "card" }, h("form", { class: "issue", onsubmit: e => e.preventDefault() },
      h("label", {}, "Certificate", h("select", { onchange: e => { s.serial = e.target.value; render(); } }, clientOptions(s.serial || "", x => true))),
      h("label", {}, "Edge address", h("span", {}, "host:port clients connect to"), h("input", { value: s.host, onchange: e => { s.host = e.target.value.trim() || "localhost:8443"; render(); } })),
      c ? h("button", { class: "btn primary", type: "button", onclick: () => download(c) }, "Download " + c.common_name) : null)),
    h("div", { class: "card", style: "margin-top:14px" },
      h("div", { class: "tabs", role: "tablist" }, Object.entries(tabs).map(([k, t]) => h("button", { role: "tab", "aria-selected": String(s.tab === k), onclick: () => { s.tab = k; render(); } }, t))),
      c && c.kind === "server" ? h("p", { class: "note", style: "margin:0 0 10px;color:var(--warn)" }, c.common_name + " is a server certificate. Clients need a client or site certificate.") : null,
      snippet(code[s.tab]), h("p", { class: "note" }, notes[s.tab])));
}

if (token) api("/api/overview").then(start, e => { if (e.message !== "signed out") signIn(e.message); }); else signIn();
</script>
